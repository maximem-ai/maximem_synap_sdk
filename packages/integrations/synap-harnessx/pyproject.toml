[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maximem-synap-harnessx"
version = "0.1.0"
description = "Synap memory integration for HarnessX — one extension for recall, tools, and stream reporting"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Synap Team"}
]
keywords = ["synap", "memory", "harnessx", "agents", "ai"]

dependencies = [
    "maximem-synap>=0.5.3",
    "maximem-synap-integrations-common>=0.2.1",
    "harnessx>=0.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["synap_harnessx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
