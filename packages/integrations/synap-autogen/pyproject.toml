[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maximem-synap-autogen"
version = "0.2.0"
description = "Synap memory integration for AutoGen / AG2"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["maximem-synap>=0.5.3", "maximem-synap-integrations-common>=0.2.1", "autogen-core>=0.4"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    # `TestAgainstARealAssistantAgent` builds a real `AssistantAgent`, which
    # lives in autogen-agentchat, not in the autogen-core this package depends
    # on. Undeclared, those three tests passed for whoever wrote them and failed
    # in CI with ModuleNotFoundError, because CI installs only what is declared.
    #
    # In the test extra rather than in `dependencies`, the same way
    # synap-microsoft-agent pins agent-framework: the runtime needs only
    # autogen-core, and making every user of this package install agentchat to
    # get a memory adapter would be a real cost for a test-only need.
    "autogen-agentchat>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["synap_autogen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
