[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maximem-synap"
dynamic = ["version"]
description = "Python SDK for MaximemSynap context management system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "MaximemSynap Team"}
]
keywords = ["context", "memory", "ai", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "cryptography>=41.0",
    "httpx>=0.25.0",
    "grpcio>=1.60.0",
    # grpcio does NOT pull protobuf in transitively, and the generated
    # `synap_service_pb2` starts with `from google.protobuf import descriptor`.
    # Without this line a clean `pip install maximem-synap` gets grpcio and no
    # protobuf, and because every proto import in grpc_client is lazy (inside
    # _create_stub, _send_heartbeat, _write_conversation_event and two more)
    # the package imports fine, the SDK constructs fine, and the failure only
    # arrives the moment a client opens the stream. That also made anticipation
    # unreachable: the only writer to the prefetch cache is the stream's
    # on_message callback, so the cache could never be populated at all.
    #
    # Lower bound 4.25.0 is what the generated stubs need, and it is proven, not
    # assumed: the stubs are generated with grpcio-tools 1.62.3 (protoc 4.25.1,
    # gencode "Protobuf Python Version: 4.25.1", no runtime-version check) and
    # were measured import + serialise + live gRPC stream OK on protobuf 4.24.4,
    # 4.25.0, 4.25.8, 5.26.0, 5.29.5, 6.31.1, 6.33.6 and 7.36.2. Stubs generated
    # by a newer protoc (6.31.1) refuse every runtime older than 6.31.1 and
    # broke installs next to libraries that pin protobuf<6 (Google generative
    # AI libraries). No upper bound: nothing found that breaks on 7.x. Do NOT
    # regenerate with a newer grpcio-tools without raising this floor;
    # tests/test_protobuf_floor.py fails if the two drift apart.
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.0",
    "pyyaml>=6.0",
]
vector = [
    "chromadb>=0.4.0",
    "pyyaml>=6.0",
]
graph = [
    "neo4j>=5.0.0",
    "pyyaml>=6.0",
]
# Local embedding model (cache/encoders.py): history search after compaction,
# and matching fetch queries to prefetched items. One int8 ONNX file, the one
# the JS SDK runs too.
local-search = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "huggingface_hub>=0.24",
    "numpy>=1.24",
]
# Other encoders history_search_model can name (cache/encoders.py). Not part of
# local-search: the default model does not need them.
local-search-fastembed = ["fastembed>=0.9"]
local-search-model2vec = ["model2vec>=0.3"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/maximem-synap/sdk-python"
Documentation = "https://docs.synap.example.com"
Repository = "https://github.com/maximem-synap/sdk-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["maximem_synap*"]

# The behavior contract is data, not code, so setuptools will not pick it
# up from the package scan. Without this the wheel ships without
# anticipation.json and every import of maximem_synap.behavior raises
# FileNotFoundError at runtime -- invisible in a source checkout, fatal
# in an installed package.
[tool.setuptools.package-data]
"maximem_synap.behavior" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "maximem_synap._version.__version__"}

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["../../tests/sdk"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
